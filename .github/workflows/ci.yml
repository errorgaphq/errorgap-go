name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # The framework adapters are separate modules, so the core stays
      # dependency-free.
      - run: go vet ./... && go test ./...
        working-directory: gin
      - run: go vet ./... && go test ./...
        working-directory: echo
